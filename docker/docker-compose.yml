version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulsedev_postgres
    restart: always
    environment:
      POSTGRES_USER: pulsedev
      POSTGRES_PASSWORD: pulsedev_secret
      POSTGRES_DB: pulsedev_enterprise
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: pulsedev_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pulsedev_app
    restart: always
    volumes:
      - appdata:/app/backend/data
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Workspace Administrator}
      DATABASE_URL: postgresql://pulsedev:pulsedev_secret@postgres:5432/pulsedev_enterprise
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  appdata:
  pgdata:
  redisdata:
